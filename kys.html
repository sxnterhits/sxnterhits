<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a1a 0%, #2c3e50 100%);
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        #result a:hover {
            color: #7c3aed;
        }
        .copy-btn:hover {
            background-color: #7c3aed;
        }
    </style>
</head>
<body class="text-gray-100">
    <div class="container max-w-lg mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500">
            URL Shortener
        </h1>
        <div class="flex flex-col sm:flex-row gap-4 mb-6">
            <input
                type="text"
                id="urlInput"
                placeholder="Enter your URL here (e.g., https://example.com)"
                class="flex-1 p-3 rounded-lg bg-gray-800 text-white border border-gray-600 focus:outline-none focus:border-cyan-400 transition"
            >
            <select
                id="serviceSelect"
                class="p-3 rounded-lg bg-gray-800 text-white border border-gray-600 focus:outline-none focus:border-cyan-400 transition"
            >
                <option value="isgd">is.gd</option>
                <option value="tinyurl">tinyurl.com</option>
                <option value="shorturlasia">ShortURL.asia (Beta)</option>
            </select>
        </div>
        <button
            onclick="shortenURL()"
            class="w-full sm:w-auto px-6 py-3 bg-cyan-500 text-white rounded-lg hover:bg-cyan-600 transition transform hover:scale-105"
        >
            Shorten It!
        </button>
        <div id="result" class="mt-6 text-lg"></div>
    </div>

    <script>
        function isValidURL(string) {
            try {
                new URL(string);
                return true;
            } catch (_) {
                return false;
            }
        }

        function shortenURL() {
            const url = document.getElementById('urlInput').value.trim();
            const service = document.getElementById('serviceSelect').value;
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<span class="text-gray-400">Working on it...</span>';

            if (!url) {
                resultDiv.innerHTML = '<span class="text-red-400">Please enter a URL</span>';
                return;
            }

            if (!isValidURL(url)) {
                resultDiv.innerHTML = '<span class="text-red-400">Please enter a valid URL (e.g., https://example.com)</span>';
                return;
            }

            const copyToClipboard = (text) => {
                navigator.clipboard.writeText(text);
                alert('Copied to clipboard!');
            };

            if (service === "isgd") {
                fetch(`https://is.gd/create.php?format=simple&url=${encodeURIComponent(url)}`)
                    .then(response => response.text())
                    .then(shortened => {
                        resultDiv.innerHTML = `
                            <span>Shortened URL: </span>
                            <a href="${shortened}" target="_blank" class="text-cyan-400 underline">${shortened}</a>
                            <button onclick="copyToClipboard('${shortened}')" class="copy-btn ml-4 px-3 py-1 bg-gray-700 rounded hover:bg-purple-600 transition">Copy</button>
                        `;
                    })
                    .catch(error => {
                        resultDiv.innerHTML = `<span class="text-red-400">Error with is.gd: ${error.message}</span>`;
                    });
            } else if (service === "tinyurl") {
                fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(url)}`)
                    .then(response => response.text())
                    .then(shortened => {
                        resultDiv.innerHTML = `
                            <span>Shortened URL: </span>
                            <a href="${shortened}" target="_blank" class="text-cyan-400 underline">${shortened}</a>
                            <button onclick="copyToClipboard('${shortened}')" class="copy-btn ml-4 px-3 py-1 bg-gray-700 rounded hover:bg-purple-600 transition">Copy</button>
                        `;
                    })
                    .catch(error => {
                        resultDiv.innerHTML = `<span class="text-red-400">Error with TinyURL: ${error.message}</span>`;
                    });
            } else if (service === "shorturlasia") {
                fetch(`https://api.shorturl.asia/shorturl`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ url: url })
                })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP error! Status: ${response.status}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        if (data.error) {
                            resultDiv.innerHTML = `<span class="text-red-400">Error with ShortURL.asia: ${data.error}</span>`;
                        } else {
                            const shortened = data.short_url;
                            resultDiv.innerHTML = `
                                <span>Shortened URL: </span>
                                <a href="${shortened}" target="_blank" class="text-cyan-400 underline">${shortened}</a>
                                <button onclick="copyToClipboard('${shortened}')" class="copy-btn ml-4 px-3 py-1 bg-gray-700 rounded hover:bg-purple-600 transition">Copy</button>
                                <p class="text-yellow-400 text-sm mt-2">Note: ShortURL.asia is in beta and may be unreliable.</p>
                            `;
                        }
                    })
                    .catch(error => {
                        resultDiv.innerHTML = `<span class="text-red-400">Error with ShortURL.asia: ${error.message}. This service may be down or the URL may be invalid.</span>`;
                    });
            }
        }
    </script>
</body>
</html>
